name: Build APK dari zip

on:
  push:
    paths:
      - 'PencatatMemori.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buka zip
        run: unzip -q -o PencatatMemori.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        working-directory: PencatatMemori
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pencatat-memori-apk
          path: PencatatMemori/build/outputs/apk/release/*.apk
